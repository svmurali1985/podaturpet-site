      <stop offset="0" stop-color="#f6cf67"/>
      <stop offset="1" stop-color="#d39a20"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3f6f"/>
