      <rect x="40" y="18" width="18" height="18" rx="3" fill="url(#navy)"/>
      <rect x="62" y="18" width="18" height="18" rx="3" fill="url(#gold)"/>
      <rect x="18" y="40" width="18" height="18" rx="3" fill="url(#navy)"/>
